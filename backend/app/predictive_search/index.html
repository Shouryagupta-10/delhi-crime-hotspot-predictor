<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: visible;
      padding: 2px 2px 4px 2px;
    }
    
    /* Search Container */
    .search-container {
      position: relative;
      width: 100%;
    }
    
    .search-box {
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 9999px;
      padding: 5px 8px 5px 14px;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .search-box:focus-within {
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
      background: rgba(15, 23, 42, 0.98);
    }
    
    .search-lens {
      font-size: 13px;
      color: #94a3b8;
      user-select: none;
      display: flex;
      align-items: center;
    }
    
    .search-input {
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-size: 13px;
      font-family: inherit;
      width: 100%;
    }
    .search-input::placeholder {
      color: #64748b;
    }
    
    .search-clear-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 13px;
      cursor: pointer;
      padding: 2px 6px;
      line-height: 1;
    }
    .search-clear-btn:hover {
      color: #fff;
    }
    
    .btn-go {
      background: linear-gradient(135deg, #0284c7, #0d9488);
      border: 1px solid #38bdf8;
      color: #fff;
      border-radius: 9999px;
      padding: 5px 14px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      user-select: none;
    }
    .btn-go:hover {
      filter: brightness(1.15);
      transform: scale(1.02);
    }
    
    /* Floating Autocomplete Dropdown */
    .predictive-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: rgba(11, 15, 25, 0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.2);
      overflow: hidden;
      z-index: 99999;
      max-height: 250px;
      overflow-y: auto;
    }
    
    .predictive-dropdown::-webkit-scrollbar {
      width: 5px;
    }
    .predictive-dropdown::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    .predictive-dropdown::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.3);
      border-radius: 3px;
    }
    
    .dropdown-header {
      font-size: 9.5px;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 8px 12px 4px 12px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-family: 'Courier New', monospace;
    }
    
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .dropdown-item:last-child {
      border-bottom: none;
    }
    .dropdown-item:hover, .dropdown-item.active-item {
      background: rgba(56, 189, 248, 0.14);
    }
    
    .dropdown-icon {
      font-size: 15px;
      flex-shrink: 0;
    }
    
    .dropdown-info {
      flex: 1;
      min-width: 0;
    }
    .dropdown-title {
      font-size: 12px;
      font-weight: 700;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dropdown-subtitle {
      font-size: 10px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }
    
    .dropdown-badge {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 9999px;
      text-transform: uppercase;
      flex-shrink: 0;
      letter-spacing: 0.03em;
    }
    .badge-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.5); }
    .badge-safe { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.5); }
    .badge-transit { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.4); }
    .badge-poi { background: rgba(168, 85, 247, 0.18); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.4); }
  </style>
</head>

    function sendHeight(h) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: h
      }, "*");
    }

    function sendSelectionToStreamlit(loc) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: loc
      }, "*");
      
      try {
        const target = window.top || window.parent;
        if (target && target.location) {
          const url = new URL(target.location.href);
          url.searchParams.set("tab2_loc", loc.name);
          url.searchParams.set("tab2_lat", loc.lat);
          url.searchParams.set("tab2_lon", loc.lon);
          url.searchParams.set("tab2_dist", loc.district);
          target.history.replaceState(null, '', url.href);
        }
      } catch (e) {}
    }

    function getPredictiveMatches(query) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      
      const localMatches = DELHI_LOCATIONS.filter(loc => 
        loc.name.toLowerCase().includes(q) || 
        loc.district.toLowerCase().includes(q)
      );
      return localMatches;
    }

    async function fetchNominatimMatches(query) {
      try {
        const q = query.trim();
        if (!q || q.length < 2) return [];
        
        const results = [];
        const seen = new Set();
        
        const addResult = (name, district, lat, lon, badge, badgeClass, premises) => {
          const key = `${name.toLowerCase()}_${lat.toFixed(3)}_${lon.toFixed(3)}`;
          if (!seen.has(key)) {
            seen.add(key);
            results.push({ 
              name, 
              district: district || 'Delhi NCR', 
              lat, 
              lon, 
              premises: premises || 'Street & Public Roadways',
              badge: badge || 'Delhi NCT', 
              badgeClass: badgeClass || 'badge-transit' 
            });
          }
        };
        
        const cleanQ = q.replace(/,/g, ' ').replace(/\s+/g, ' ');
        const hasDelhi = cleanQ.toLowerCase().includes('delhi');
        const searchTermDelhi = hasDelhi ? cleanQ : `${cleanQ}, Delhi`;
        
        // 1. Photon API with Delhi bias
        try {
          const pController = new AbortController();
          const pTimeout = setTimeout(() => pController.abort(), 2500);
          const photonUrl = `https://photon.komoot.io/api/?q=${encodeURIComponent(cleanQ)}&lat=28.6139&lon=77.2090&limit=10`;
          const pres = await fetch(photonUrl, { signal: pController.signal });
          clearTimeout(pTimeout);
          if (pres.ok) {
            const pdata = await pres.json();
            if (pdata && pdata.features) {
              pdata.features.forEach(f => {
                const c = f.geometry.coordinates;
                if (c[1] >= 28.15 && c[1] <= 29.15 && c[0] >= 76.60 && c[0] <= 77.70) {
                  const p = f.properties;
                  const title = p.name || p.street || cleanQ;
                  const sub = [p.district, p.city || p.locality || 'Delhi', p.state].filter(Boolean).join(', ');
                  const typeDesc = p.osm_value ? p.osm_value.replace(/_/g, ' ') : 'Place';
                  let premises = 'Street & Public Roadways';
                  if (p.osm_value && ['shop', 'supermarket', 'mall', 'restaurant', 'cafe'].includes(p.osm_value)) {
                    premises = 'Commercial & Retail Market';
                  } else if (p.osm_value && ['station', 'subway', 'bus_station'].includes(p.osm_value)) {
                    premises = 'Transit & Metro Hub';
                  }
                  addResult(title, sub, c[1], c[0], typeDesc.toUpperCase(), 'badge-poi', premises);
                }
              });
            }
          }
        } catch (pe) {}
        
        // 2. Nominatim API with Delhi NCR bbox
        try {
          const nController = new AbortController();
          const nTimeout = setTimeout(() => nController.abort(), 2500);
          const osmUrl = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=in&viewbox=76.80,28.95,77.45,28.35&bounded=0&limit=8&q=${encodeURIComponent(searchTermDelhi)}`;
          const nres = await fetch(osmUrl, { 
            headers: { 'Accept-Language': 'en' },
            signal: nController.signal 
          });
          clearTimeout(nTimeout);
          if (nres.ok) {
            const ndata = await nres.json();
            if (ndata && Array.isArray(ndata)) {
              ndata.forEach(d => {
                const lat = parseFloat(d.lat);
                const lon = parseFloat(d.lon);
                if (lat >= 28.15 && lat <= 29.15 && lon >= 76.60 && lon <= 77.70) {
                  const parts = d.display_name.split(',');
                  const title = parts[0].trim();
                  const district = parts.slice(1, 4).join(',').trim();
                  addResult(title, district, lat, lon, d.type ? d.type.toUpperCase() : 'Delhi NCT', 'badge-transit', 'Street & Public Roadways');
                }
              });
            }
          }
        } catch (ne) {}
        
        return results;
      } catch (e) {
        console.warn('Location search error:', e);
      }
      return [];
    }

    searchInput.addEventListener('input', (e) => {
      hasUserTyped = true;
      const query = e.target.value;
      clearBtn.style.display = query ? 'block' : 'none';
      
      if (!query.trim()) {
        searchDropdown.style.display = 'none';
        sendHeight(52);
        return;
      }
      
      const localMatches = getPredictiveMatches(query);
      if (localMatches.length > 0) {
        renderSuggestions(localMatches, true);
      } else {
        renderSuggestions([], true);
      }
      
      if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(async () => {
        const remoteMatches = await fetchNominatimMatches(query);
        
        if (searchInput.value.trim() !== query.trim()) return;
        
        if (remoteMatches && remoteMatches.length > 0) {
          const names = new Set(localMatches.map(m => m.name.toLowerCase()));
          const combined = [...localMatches];
          remoteMatches.forEach(rm => {
            if (!names.has(rm.name.toLowerCase())) {
              combined.push(rm);
              names.add(rm.name.toLowerCase());
            }
          });
          renderSuggestions(combined.slice(0, 10), false);
        } else {
          renderSuggestions(localMatches, false);
        }
      }, 250);
    });

    searchInput.addEventListener('keydown', (e) => {
      if (searchDropdown.style.display === 'none') {
        if (e.key === 'Enter') executeSearch();
        return;
      }
      
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (currentSuggestions.length > 0) {
          selectedIndex = (selectedIndex + 1) % currentSuggestions.length;
          highlightSelectedItem();
        }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (currentSuggestions.length > 0) {
          selectedIndex = (selectedIndex - 1 + currentSuggestions.length) % currentSuggestions.length;
          highlightSelectedItem();
        }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (selectedIndex >= 0 && selectedIndex < currentSuggestions.length) {
          selectSuggestion(selectedIndex);
        } else {
          executeSearch();
        }
      } else if (e.key === 'Escape') {
        searchDropdown.style.display = 'none';
        sendHeight(52);
      }
    });

    function highlightSelectedItem() {
      document.querySelectorAll('.dropdown-item').forEach((el, idx) => {
        el.classList.toggle('active-item', idx === selectedIndex);
      });
    }

    window.selectSuggestion = function(idx) {
      const item = currentSuggestions[idx];
      if (!item) return;
      
      searchInput.value = item.name;
      searchDropdown.style.display = 'none';
      clearBtn.style.display = 'block';
      sendHeight(52);
      
      sendSelectionToStreamlit(item);
    };

    window.clearSearchInput = function() {
      searchInput.value = '';
      clearBtn.style.display = 'none';
      searchDropdown.style.display = 'none';
      searchInput.focus();
      sendHeight(52);
    };

    window.executeSearch = async function() {
      const q = searchInput.value.trim();
      if (!q) return;
      
      if (selectedIndex >= 0 && currentSuggestions[selectedIndex]) {
        selectSuggestion(selectedIndex);
        return;
      }
      
      const localMatches = getPredictiveMatches(q);
      if (localMatches.length > 0) {
        selectSuggestion(0);
        return;
      }
      
      searchDropdown.innerHTML = `
        <div style="padding: 14px; font-size: 11px; color: #38bdf8; text-align: center;">
          🔍 Resolving location across Delhi NCR geocoders...
        </div>
      `;
      searchDropdown.style.display = 'block';
      sendHeight(100);
      
      const remote = await fetchNominatimMatches(q);
      if (remote && remote.length > 0) {
        currentSuggestions = remote;
        selectSuggestion(0);
      } else {
        const fallback = {
          name: q,
          district: "New Delhi",
          premises: "Street & Public Roadways",
          lat: 28.6328,
          lon: 77.2195,
          badge: "Delhi NCT",
          badgeClass: "badge-transit"
        };
        searchDropdown.style.display = 'none';
        sendHeight(52);
        sendSelectionToStreamlit(fallback);
      }
    };

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-container')) {
        searchDropdown.style.display = 'none';
        sendHeight(52);
      }
    });

    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "streamlit:render") {
        const args = event.data.args || {};
        if (args.default_query && !hasUserTyped) {
          searchInput.value = args.default_query;
          clearBtn.style.display = 'block';
        }
      }
    });

    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:componentReady",
      apiVersion: 1
    }, "*");
    
    sendHeight(52);
  </script>
</body>
</html>
